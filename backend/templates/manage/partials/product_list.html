{% for product in products %}
    {% include "manage/partials/product_row.html" %}
{% else %}
<tr>
    <td colspan="5" class="text-center py-5">
        <i class="bi bi-box-seam display-4 text-muted d-block mb-3"></i>
        <p class="text-muted">No products found. Start by adding your first item!</p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <button type="button" class="btn btn-primary btn-sm" onclick="document.getElementById('add-product-panel').classList.add('show')">
                <i class="bi bi-plus-lg me-1"></i>Add Product
            </button>
            <a href="{{ url_for('main_bp.add_shop', new=1) }}" class="btn btn-outline-success btn-sm">
                <i class="bi bi-shop-window me-1"></i>Add New Shop
            </a>
        </div>
    </td>
</tr>
{% endfor %}
